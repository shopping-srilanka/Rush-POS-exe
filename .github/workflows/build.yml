name: Rush POS Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: rush-pos-desktop
        run: npm install

      - name: Build Windows EXE
        working-directory: rush-pos-desktop
        run: npm run dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Rush-POS-Windows-EXE
          path: rush-pos-desktop/dist/*.exe
          if-no-files-found: error
